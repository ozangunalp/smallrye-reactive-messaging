---
name: Build with Dependency from Source

on:
    workflow_dispatch:
        inputs:
            dependency-repo:
                description: 'GitHub repository of the dependency (e.g., smallrye/smallrye-mutiny)'
                required: true
                type: string
            dependency-branch:
                description: 'Branch or tag to checkout'
                required: false
                default: 'main'
                type: string
            dependency-version-property:
                description: 'Maven property to override with the dependency version (e.g., vertx.version, smallrye-config.version). Leave empty if versions already match (e.g., mutiny at 999-SNAPSHOT).'
                required: false
                default: ''
                type: string
            dependency-build-arguments:
                description: 'Additional Maven arguments for the dependency build'
                required: false
                default: ''
                type: string

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            dependency-version: ${{ steps.extract-version.outputs.version }}
            dependency-group-path: ${{ steps.extract-version.outputs.group-path }}
        strategy:
            matrix:
                java:
                    - '17'
                    - '21'
                    - '25'
        name: Build (Java ${{ matrix.java }})
        steps:
            -   uses: actions/checkout@v6
            -   uses: actions/checkout@v6
                with:
                    repository: ${{ inputs.dependency-repo }}
                    ref: ${{ inputs.dependency-branch }}
                    path: dependency
            -   uses: actions/setup-java@v5
                with:
                    java-version: ${{ matrix.java }}
                    distribution: temurin
                    cache: maven
            -   name: Extract dependency version
                id: extract-version
                if: ${{ inputs.dependency-version-property != '' }}
                working-directory: dependency
                run: |
                    VERSION=$(mvn -s $GITHUB_WORKSPACE/.build/ci-maven-settings.xml -Dmaven.resolver.transport=wagon \
                      help:evaluate -Dexpression=project.version -q -DforceStdout)
                    GROUP_ID=$(mvn -s $GITHUB_WORKSPACE/.build/ci-maven-settings.xml -Dmaven.resolver.transport=wagon \
                      help:evaluate -Dexpression=project.groupId -q -DforceStdout)
                    GROUP_PATH=$(echo "$GROUP_ID" | tr '.' '/')
                    echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                    echo "group-path=$GROUP_PATH" >> "$GITHUB_OUTPUT"
                    echo "Dependency version: $VERSION (groupId: $GROUP_ID, path: $GROUP_PATH)"
            -   name: Set version override
                if: ${{ inputs.dependency-version-property != '' }}
                run: |
                    echo "DEPENDENCY_VERSION_OVERRIDE=-D${{ inputs.dependency-version-property }}=${{ steps.extract-version.outputs.version }}" >> "$GITHUB_ENV"
            -   name: Build Dependency
                working-directory: dependency
                run: |
                    mvn -s $GITHUB_WORKSPACE/.build/ci-maven-settings.xml -Dmaven.resolver.transport=wagon \
                      -B clean install -DskipTests ${{ inputs.dependency-build-arguments }}
            -   name: Build with Maven
                run: |
                    mvn -s .build/ci-maven-settings.xml -Dmaven.resolver.transport=wagon \
                      -B clean install -DskipTests -T1C $DEPENDENCY_VERSION_OVERRIDE
            -   name: Upload Maven Repository
                uses: actions/upload-artifact@v7
                with:
                    name: maven-repo-java-${{ matrix.java }}
                    path: ~/.m2/repository/io/smallrye/
                    retention-days: 1
            -   name: Upload Dependency Repository
                if: ${{ inputs.dependency-version-property != '' && !startsWith(steps.extract-version.outputs.group-path, 'io/smallrye') }}
                uses: actions/upload-artifact@v7
                with:
                    name: dependency-repo-java-${{ matrix.java }}
                    path: ~/.m2/repository/${{ steps.extract-version.outputs.group-path }}/
                    retention-days: 1

    core-tests:
        needs: build
        runs-on: ubuntu-latest
        env:
            DEPENDENCY_VERSION_OVERRIDE: ${{ inputs.dependency-version-property != '' && format('-D{0}={1}', inputs.dependency-version-property, needs.build.outputs.dependency-version) || '' }}
        strategy:
            fail-fast: false
            matrix:
                java:
                    - '17'
                    - '21'
                    - '25'
        name: Core Tests (Java ${{ matrix.java }})
        steps:
            -   uses: actions/checkout@v6
            -   uses: actions/setup-java@v5
                with:
                    java-version: ${{ matrix.java }}
                    distribution: temurin
                    cache: maven
            -   name: Download Maven Repository
                uses: actions/download-artifact@v8
                with:
                    name: maven-repo-java-${{ matrix.java }}
                    path: ~/.m2/repository/io/smallrye/
            -   name: Download Dependency Repository
                if: ${{ needs.build.outputs.dependency-group-path != '' && !startsWith(needs.build.outputs.dependency-group-path, 'io/smallrye') }}
                uses: actions/download-artifact@v8
                with:
                    name: dependency-repo-java-${{ matrix.java }}
                    path: ~/.m2/repository/${{ needs.build.outputs.dependency-group-path }}/
            -   name: Run Core Tests
                run: |
                    mvn -s .build/ci-maven-settings.xml -Dmaven.resolver.transport=wagon \
                      -B verify -Dtest-containers=true \
                      -Drevapi.skip=true -Dformat.skip=true \
                      ${{ matrix.java == '25' && '-Pcoverage' || '' }} \
                      $DEPENDENCY_VERSION_OVERRIDE \
                      -pl :smallrye-reactive-messaging-api,:smallrye-reactive-messaging-provider,:smallrye-reactive-messaging-otel,:smallrye-reactive-messaging-health,:smallrye-reactive-messaging-jackson,:smallrye-reactive-messaging-jsonb,:test-common,:smallrye-connector-attribute-processor,:smallrye-reactive-messaging-kafka-api,:smallrye-reactive-messaging-kafka-test-companion
            -   name: Codecov
                if: matrix.java == '25'
                uses: codecov/codecov-action@v6

    kafka-tests:
        needs: build
        runs-on: ubuntu-latest
        env:
            DEPENDENCY_VERSION_OVERRIDE: ${{ inputs.dependency-version-property != '' && format('-D{0}={1}', inputs.dependency-version-property, needs.build.outputs.dependency-version) || '' }}
        strategy:
            fail-fast: false
            matrix:
                java:
                    - '17'
                    - '21'
                    - '25'
        name: Kafka Tests (Java ${{ matrix.java }})
        steps:
            -   uses: actions/checkout@v6
            -   uses: actions/setup-java@v5
                with:
                    java-version: ${{ matrix.java }}
                    distribution: temurin
                    cache: maven
            -   name: Download Maven Repository
                uses: actions/download-artifact@v8
                with:
                    name: maven-repo-java-${{ matrix.java }}
                    path: ~/.m2/repository/io/smallrye/
            -   name: Download Dependency Repository
                if: ${{ needs.build.outputs.dependency-group-path != '' && !startsWith(needs.build.outputs.dependency-group-path, 'io/smallrye') }}
                uses: actions/download-artifact@v8
                with:
                    name: dependency-repo-java-${{ matrix.java }}
                    path: ~/.m2/repository/${{ needs.build.outputs.dependency-group-path }}/
            -   name: Run Kafka Tests
                run: |
                    mvn -s .build/ci-maven-settings.xml -Dmaven.resolver.transport=wagon \
                      -B verify -Dtest-containers=true \
                      -Drevapi.skip=true -Dformat.skip=true \
                      ${{ matrix.java == '25' && '-Pcoverage' || '' }} \
                      $DEPENDENCY_VERSION_OVERRIDE \
                      -pl :smallrye-reactive-messaging-kafka
            -   name: Codecov
                if: matrix.java == '25'
                uses: codecov/codecov-action@v6

    connector-tests:
        needs: build
        runs-on: ubuntu-latest
        env:
            DEPENDENCY_VERSION_OVERRIDE: ${{ inputs.dependency-version-property != '' && format('-D{0}={1}', inputs.dependency-version-property, needs.build.outputs.dependency-version) || '' }}
        strategy:
            fail-fast: false
            matrix:
                connector:
                    -   name: AMQP
                        artifact: smallrye-reactive-messaging-amqp
                    -   name: MQTT
                        artifact: smallrye-reactive-messaging-mqtt
                    -   name: RabbitMQ
                        artifact: smallrye-reactive-messaging-rabbitmq
                    -   name: Pulsar
                        artifact: smallrye-reactive-messaging-pulsar
                    -   name: GCP Pub/Sub
                        artifact: smallrye-reactive-messaging-gcp-pubsub
                    -   name: AWS SNS
                        artifact: smallrye-reactive-messaging-aws-sns
                    -   name: AWS SQS
                        artifact: smallrye-reactive-messaging-aws-sqs
                    -   name: Camel
                        artifact: smallrye-reactive-messaging-camel
                    -   name: JMS
                        artifact: smallrye-reactive-messaging-jms
                    -   name: In-Memory
                        artifact: smallrye-reactive-messaging-in-memory
                java:
                    - '17'
                    - '21'
                    - '25'
        name: ${{ matrix.connector.name }} Tests (Java ${{ matrix.java }})
        steps:
            -   uses: actions/checkout@v6
            -   uses: actions/setup-java@v5
                with:
                    java-version: ${{ matrix.java }}
                    distribution: temurin
                    cache: maven
            -   name: Download Maven Repository
                uses: actions/download-artifact@v8
                with:
                    name: maven-repo-java-${{ matrix.java }}
                    path: ~/.m2/repository/io/smallrye/
            -   name: Download Dependency Repository
                if: ${{ needs.build.outputs.dependency-group-path != '' && !startsWith(needs.build.outputs.dependency-group-path, 'io/smallrye') }}
                uses: actions/download-artifact@v8
                with:
                    name: dependency-repo-java-${{ matrix.java }}
                    path: ~/.m2/repository/${{ needs.build.outputs.dependency-group-path }}/
            -   name: Run ${{ matrix.connector.name }} Tests
                run: |
                    mvn -s .build/ci-maven-settings.xml -Dmaven.resolver.transport=wagon \
                      -B verify -Dtest-containers=true \
                      -Drevapi.skip=true -Dformat.skip=true \
                      ${{ matrix.java == '25' && '-Pcoverage' || '' }} \
                      $DEPENDENCY_VERSION_OVERRIDE \
                      -pl :${{ matrix.connector.artifact }}
            -   name: Codecov
                if: matrix.java == '25'
                uses: codecov/codecov-action@v6

    slow-flaky-tests:
        needs: build
        runs-on: ubuntu-latest
        continue-on-error: true
        env:
            DEPENDENCY_VERSION_OVERRIDE: ${{ inputs.dependency-version-property != '' && format('-D{0}={1}', inputs.dependency-version-property, needs.build.outputs.dependency-version) || '' }}
        strategy:
            fail-fast: false
            matrix:
                connector:
                    -   name: Kafka
                        artifact: smallrye-reactive-messaging-kafka
                    -   name: Pulsar
                        artifact: smallrye-reactive-messaging-pulsar
                    -   name: Kafka Test Companion
                        artifact: smallrye-reactive-messaging-kafka-test-companion
        name: ${{ matrix.connector.name }} Slow/Flaky Tests
        steps:
            -   uses: actions/checkout@v6
            -   uses: actions/setup-java@v5
                with:
                    java-version: '21'
                    distribution: temurin
                    cache: maven
            -   name: Download Maven Repository
                uses: actions/download-artifact@v8
                with:
                    name: maven-repo-java-21
                    path: ~/.m2/repository/io/smallrye/
            -   name: Download Dependency Repository
                if: ${{ needs.build.outputs.dependency-group-path != '' && !startsWith(needs.build.outputs.dependency-group-path, 'io/smallrye') }}
                uses: actions/download-artifact@v8
                with:
                    name: dependency-repo-java-21
                    path: ~/.m2/repository/${{ needs.build.outputs.dependency-group-path }}/
            -   name: Run ${{ matrix.connector.name }} Slow/Flaky Tests
                run: |
                    mvn -s .build/ci-maven-settings.xml -Dmaven.resolver.transport=wagon \
                      -B verify -Pslow-flaky-tests -Dtest-containers=true \
                      -Drevapi.skip=true -Dformat.skip=true \
                      $DEPENDENCY_VERSION_OVERRIDE \
                      -pl :${{ matrix.connector.artifact }}
